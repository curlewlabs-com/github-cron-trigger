name: CI

# Every pull request and push to main runs the checks a contributor runs
# locally, plus the live check against GitHub's API. The weekly run catches
# what changes outside this repository - the API, the runner images and the
# yq they carry - before a user's scheduled run does; it also gives the
# live check a schedule line of this workflow's own to resolve.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  test:
    # The oldest Python the package supports, and the python3 and yq each
    # runner image ships, on Linux x86_64 and arm64 and on macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.10"
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

  check:
    # The check action as a user's pull request runs it, against this
    # repository's own workflows, so a broken action.yml fails here first; and
    # on a problem it must report. On the runner image's python3 and on the
    # oldest the package supports, since the launcher every action shares
    # (lib/run-package.sh) must start on both.
    strategy:
      fail-fast: false
      matrix:
        python: ["", "3.10"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check action, as a pull request runs it
        uses: ./check
      - name: Add a problem, and a module named like the package
        # The action runs in the consumer's checkout, which can hold a file
        # named like the package; were it imported in the package's place, the
        # check would pass.
        run: |
          printf 'name: Hourly\non:\n  schedule:\n    - cron: "17 * * * *"\n  repository_dispatch:\n    types: [github-cron-trigger/hourly.yml]\njobs:\n  work:\n    runs-on: ubuntu-24.04\n    steps:\n      - uses: curlewlabs-com/github-cron-trigger/slot@v0\n' > .github/workflows/hourly.yml
          printf 'pass\n' > github_cron_trigger.py
      - name: The check action reports the problem
        id: judged
        continue-on-error: true
        uses: ./check
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  live:
    # Writes and deletes git refs, so it needs a token that can; a pull
    # request from a fork gets a read-only one and skips every step, each on
    # the same condition. The condition sits on the steps rather than the job
    # so the job still ends in success there, and conclusion can require
    # success from it everywhere.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One at a time across every ref: the clock check claims and removes the
    # repository's marks for clock-check.yml, which a second live job running
    # beside it would see change under it. A fork's job touches no ref, and
    # gets a group of its own run: in the shared one, its arrival would replace
    # a real check waiting there, cancelling it.
    concurrency:
      group: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'live-check' || format('live-fork-{0}', github.run_id) }}
      cancel-in-progress: false
    # Holds the full retries of a failing `gh` call (github.py's
    # GH_TIMEOUT_SECONDS, RETRY_DELAYS_SECONDS and RATE_LIMIT_DELAY_SECONDS)
    # for the check and again for its cleanup, so an API outage ends in a failed
    # step with its message rather than a job cancelled at the cap. The healthy
    # path takes seconds.
    timeout-minutes: 20
    steps:
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Slot action, as an enrolled workflow runs it
        id: slot
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./slot

      - name: Only this workflow's schedule run is a scheduled delivery
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED: ${{ steps.slot.outputs.scheduled }}
          SLOT: ${{ steps.slot.outputs.slot }}
          RUN: ${{ steps.slot.outputs.run }}
        run: |
          expected=false
          if [ "$EVENT_NAME" = schedule ]; then expected=true; fi
          if [ "$SCHEDULED" != "$expected" ] || [ "$RUN" != true ]; then
            echo "::error::$EVENT_NAME run: expected scheduled=$expected run=true, got scheduled=$SCHEDULED run=$RUN"
            exit 1
          fi
          echo "ok: a $EVENT_NAME run is scheduled=$SCHEDULED slot=$SLOT and proceeds"

      - name: Live check against the GitHub API
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only a pull request may skip the clock check: its default branch can
          # predate the workflow the check runs clocks against.
          set --
          if [ "$EVENT_NAME" != pull_request ]; then set -- --require-clock-check; fi
          python3 -m tests.live_check \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$RECORD_SHA" \
            --workflow-file "ci-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.yml" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            "$@"

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@e950a019827e6d8ad19e9f26f5bab4abb181a4e6 # v0.3.7

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [lint, test, check, live, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          CHECK: ${{ needs.check.result }}
          LIVE: ${{ needs.live.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: |
          test "$LINT" = success && test "$TEST" = success &&
            test "$CHECK" = success && test "$LIVE" = success &&
            test "$BASELINE" = success
